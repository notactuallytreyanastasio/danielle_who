<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tardisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00529b"/>
      <stop offset="100%" stop-color="#003b6f"/>
    </linearGradient>
  </defs>
  <!-- Main body -->
  <rect x="6" y="6" width="20" height="24" rx="1" fill="url(#tardisGrad)"/>
  <!-- Top cap -->
  <rect x="4" y="4" width="24" height="3" rx="1" fill="#003b6f"/>
  <!-- Lamp housing -->
  <rect x="12" y="1" width="8" height="3" rx="1" fill="#002855"/>
  <!-- Lamp -->
  <rect x="14" y="0" width="4" height="2" rx="1" fill="#4fc3f7"/>
  <!-- Windows row 1 -->
  <rect x="8" y="8" width="6" height="4" rx="0.5" fill="#1a237e" opacity="0.8"/>
  <rect x="18" y="8" width="6" height="4" rx="0.5" fill="#1a237e" opacity="0.8"/>
  <!-- Windows row 2 -->
  <rect x="8" y="14" width="6" height="4" rx="0.5" fill="#1a237e" opacity="0.8"/>
  <rect x="18" y="14" width="6" height="4" rx="0.5" fill="#1a237e" opacity="0.8"/>
  <!-- Door panels -->
  <rect x="8" y="20" width="7" height="8" rx="0.5" fill="#002855"/>
  <rect x="17" y="20" width="7" height="8" rx="0.5" fill="#002855"/>
  <!-- Sign -->
  <rect x="9" y="6" width="14" height="2" rx="0.5" fill="#fff" opacity="0.9"/>
